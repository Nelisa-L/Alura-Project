services:
  - type: web
    name: nelisapay-agent
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python src/ingest.py"
    startCommand: "streamlit run app.py --server.port $PORT --server.address 0.0.0.0"
    envVars:
      - key: GROQ_API_KEY
        sync: false
